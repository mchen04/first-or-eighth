# Games & tools — the single canonical list powering the whole hub.
#
# The listing, search, filters, sort, builder counts, related games, footer,
# online count, and the static checks all derive from this file. To add an
# entry, copy one block, fill in the fields, and drop a screenshot at
# assets/<id>.png (then run `npm run assets`). That's it.
#
# Quote any value containing a literal "#" (e.g. tagline: "Be the #1 player",
# accent: "#ff3d7f") — an unquoted " #" starts a comment and the parser will
# flag it. Also quote values that look like a number or true/false/null when you
# mean them as text (e.g. name: "2048").
#
# Fields:
#   id          Required. URL slug (#/game/<id>) AND the screenshot base name
#               (assets/<id>.png, assets/<id>-card.webp, assets/<id>-detail.webp).
#               Lowercase letters, numbers, and dashes.
#   name        Required. Display name.
#   kind        Optional. "game" (default) or "tool". Tools say "Open" where
#               games say "Play".
#   status      Required. "Live" or "WIP".
#   url         Play/Open URL. Required for every entry; a WIP entry may point at
#               a preview/early build.
#   source      Required. An https://github.com/ URL, or the literal `private`
#               when the app is public but its repository is not. A private
#               source renders a non-link "Private source" note.
#   creator     Required. A creator id from data/creators.yaml.
#   editors     List of creator ids who edited it. Use [] for none.
#   genre       Required. One of: Party, Sports, Cards & Casino, Guessing, Tools.
#   added       Required. YYYY-MM-DD GitHub repository creation date. Cards and
#               detail show the year; "Newest" sorts on the full date.
#   captured    Optional. YYYY-MM-DD the thumbnail capture was taken; the tag
#               reads like "Captured Nov 2026". Entries with a screenshot carry
#               one.
#   accent      Required. Hex accent color (quoted, leading "#").
#   tagline     Required. One short line shown on the card and detail.
#   description Required. A paragraph. The `>` folds wrapped lines into one.
#   screenshot  Optional. Set to false for entries with no capture (uses the
#               striped placeholder). Defaults to true (derived from id).

